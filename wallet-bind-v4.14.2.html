<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IPT｜會員錢包綁定中心</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<style>:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box;min-width:0}body{margin:0}header{background:#10243d;color:#fff;padding:24px 18px 30px;border-radius:0 0 26px 26px}h1{font-size:1.5rem}main{max-width:760px;margin:auto;padding:16px 14px 70px}.panel{background:#fff;border:1px solid #dde5ef;border-radius:18px;padding:16px;margin-bottom:14px}.status{border-radius:12px;padding:12px 14px;line-height:1.65;background:#edf4ff;border:1px solid #ccddf5}.ok{background:#ebf8f2;color:#17694f}.warn{background:#fff7df;color:#7e5a08}.err{background:#fff0f0;color:#922c2c}.row{padding:10px 0;border-bottom:1px solid #edf1f5}.label{font-size:.78rem;color:#64748b}.value{font-weight:850;overflow-wrap:anywhere}button{width:100%;min-height:50px;border-radius:12px;border:1px solid #cbd5e1;padding:11px;font:inherit;font-weight:900;margin-top:10px}.primary{background:#176c59;color:#fff}.blue{background:#2a5f91;color:#fff}.light{background:#fff;color:#29445f}button:disabled{opacity:.45}.note{font-size:.84rem;color:#64748b;line-height:1.7;margin-top:10px}</style>
<style id="hf49e-mobile-wallet-layout">
html,body{max-width:100%;overflow-x:hidden}
main,.panel,.row,.status{width:100%;max-width:100%;min-width:0}
.value,#candidate,#walletState,#bindState{
  max-width:100%;
  min-width:0;
  overflow-wrap:anywhere;
  word-break:break-word;
  white-space:normal;
}
button{
  max-width:100%;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
}
@media(max-width:480px){
  main{padding-left:10px;padding-right:10px}
  .panel{padding:14px}
  .value,#candidate,#walletState,#bindState{font-size:.96rem;line-height:1.65}
}
</style>
</head>
<body><header><div>V4.14.2｜HF49-E</div><h1>會員錢包綁定中心</h1><p>Trust Wallet × Ethereum Sepolia × 簽章所有權驗證</p></header><main>
<section class="panel"><h2>① 會員身分</h2><div id="memberState" class="status">正在確認…</div><div class="row"><div class="label">會員</div><div id="memberName" class="value">—</div></div><div class="row"><div class="label">目前主錢包</div><div id="currentPrimary" class="value">—</div></div><div class="row"><div class="label">驗證狀態</div><div id="currentVerified" class="value">—</div></div></section>
<section class="panel"><h2>② 連接 Trust Wallet</h2><div id="walletState" class="status warn">尚未連線。</div><button id="connectBtn" class="blue" disabled>連接 Trust Wallet</button><button id="disconnectBtn" class="light" disabled>中斷連線／切換錢包</button><div class="note">請選擇這位會員自己的錢包。已屬於其他會員的地址無法綁定。</div></section>
<section class="panel"><h2>③ 簽章驗證並綁定</h2><div id="bindState" class="status warn">請先確認會員身分並連接 Trust Wallet。</div><div class="row"><div class="label">即將綁定地址</div><div id="candidate" class="value">—</div></div><div class="row"><div class="label">網路</div><div class="value">Ethereum Sepolia｜11155111</div></div><button id="bindBtn" class="primary" disabled>簽署驗證並設為我的主錢包</button><div class="note"><b>簽署不是轉帳。</b>不扣 IPT、不送出鏈上交易，也不需要 Gas。簽章成功後才建立正式主錢包與驗證紀錄。</div></section>
<section class="panel"><button id="homeBtn" class="light">返回首頁</button></section></main>
<script type="module">
import { EthereumProvider } from "https://esm.sh/@walletconnect/ethereum-provider@2.25.0?bundle";
const U="https://uccexvgqmoxhgykkjdcy.supabase.co",K="sb_publishable_FBsN1DYTQMv2_bWhpbXHAA_qdAq7ri7",P="80a61b62ea34b975d7d27a037fc55fa8",C=11155111;
const sb=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);
let wc=null,account="",ready=false,primary="";
const same=(a,b)=>String(a||"").toLowerCase()===String(b||"").toLowerCase();
function st(id,k,t){const e=$(id);e.className="status "+k;e.textContent=t}
async function member(){
 try{const {data:{user},error}=await sb.auth.getUser();if(error||!user)throw new Error("請先登入會員。");
 const {data:a,error:ae}=await sb.rpc("ipt_device_access_allowed");if(ae)throw ae;if(a!==true)throw new Error("這個瀏覽器尚未通過受信任裝置驗證。");
 const [p,w,v]=await Promise.all([sb.from("member_profiles").select("member_number,display_name,status").eq("id",user.id).maybeSingle(),sb.from("member_wallets").select("wallet_address,is_primary,created_at").eq("user_id",user.id).eq("chain_id",C).order("is_primary",{ascending:false}).order("created_at",{ascending:true}),sb.from("verified_wallets").select("wallet_address,verified_at").eq("user_id",user.id).eq("chain_id",C)]);
 if(p.error||w.error||v.error)throw(p.error||w.error||v.error);if(!p.data||p.data.status!=="active")throw new Error("會員不是正常狀態。");
 const x=(w.data||[]).find(z=>z.is_primary)||(w.data||[])[0]||null;primary=String(x?.wallet_address||"");const verified=(v.data||[]).some(z=>same(z.wallet_address,primary));
 $("memberName").textContent=`${p.data.member_number}｜${p.data.display_name}`;$("currentPrimary").textContent=primary||"尚未綁定";$("currentVerified").textContent=verified?"已驗證 ✓":"未驗證";ready=true;$("connectBtn").disabled=false;st("memberState","ok","會員身分與受信任裝置驗證通過。");
 }catch(e){ready=false;$("connectBtn").disabled=true;st("memberState","err",e?.message||String(e))}}
async function init(){if(wc)return wc;wc=await EthereumProvider.init({projectId:P,chains:[C],showQrModal:true,methods:["personal_sign"],optionalMethods:["eth_accounts","eth_requestAccounts","eth_chainId","wallet_switchEthereumChain"],events:["chainChanged","accountsChanged"],optionalEvents:["connect","disconnect","message"],metadata:{name:"Independent Points V4.14.2",description:"Member wallet binding on Ethereum Sepolia",url:"https://avg168.github.io",icons:[]},qrModalOptions:{themeMode:"light"}});wc.on("accountsChanged",a=>{account=a?.[0]||"";render()});wc.on("chainChanged",render);wc.on("disconnect",()=>{account="";render()});return wc}
async function cid(){try{return Number(BigInt(await wc.request({method:"eth_chainId"})))}catch(_){return Number(wc?.chainId||0)}}
async function resetWalletConnect(){
  try{if(wc?.session)await wc.disconnect()}catch(_){}
  try{
    const keys=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i)||"";
      if(/walletconnect|wc@2|wc_/i.test(k))keys.push(k);
    }
    keys.forEach(k=>{try{localStorage.removeItem(k)}catch(_){}});
  }catch(_){}
  try{
    const keys=[];
    for(let i=0;i<sessionStorage.length;i++){
      const k=sessionStorage.key(i)||"";
      if(/walletconnect|wc@2|wc_/i.test(k))keys.push(k);
    }
    keys.forEach(k=>{try{sessionStorage.removeItem(k)}catch(_){}});
  }catch(_){}
  wc=null;account="";
  $("candidate").textContent="—";
  $("bindBtn").disabled=true;
  $("disconnectBtn").disabled=true;
  st("walletState","warn","舊 WalletConnect 連線已清除。請按「連接 Trust Wallet」重新選擇錢包。");
  st("bindState","warn","尚未建立新的錢包連線；不要使用舊 Owner Wallet 進行綁定。");
}
async function render(){if(!wc?.session){account="";$("candidate").textContent="—";$("bindBtn").disabled=true;$("disconnectBtn").disabled=true;st("walletState","warn","尚未連線。");return}account=wc.accounts?.[0]||account||"";const c=await cid();$("candidate").textContent=account||"—";$("disconnectBtn").disabled=false;if(c!==C){$("bindBtn").disabled=true;st("walletState","err",`目前 Chain ID ${c}，請切換到 Sepolia（11155111）。`);return}$("bindBtn").disabled=!(ready&&account);st("walletState","ok",`已連線：${account}｜Ethereum Sepolia`);st("bindState",same(primary,account)?"ok":"warn",same(primary,account)?"目前地址已是會員主錢包，可重新驗證。":"請核對完整地址後再簽署驗證。")}
$("connectBtn").onclick=async()=>{try{
  const p=await init();
  if(!p.session)await p.connect({chains:[C]});
  await render();
}catch(e){st("walletState","err","連線失敗："+(e?.message||String(e)))}};
$("disconnectBtn").onclick=async()=>{
  if(!confirm("確定要清除目前 WalletConnect 連線並重新選擇錢包嗎？\n\n這不會刪除 Trust Wallet，也不會移動任何 IPT。"))return;
  await resetWalletConnect();
};
$("bindBtn").onclick=async()=>{const b=$("bindBtn");try{if(!ready||!account)throw new Error("會員或錢包尚未就緒。");if(!confirm("確認把畫面上的完整地址設為這位會員的主錢包？\n\n接下來只簽署驗證訊息，不會轉帳、不會扣 IPT。"))return;b.disabled=true;b.textContent="建立驗證訊息…";
 const {data:ch,error:ce}=await sb.functions.invoke("bind-wallet",{body:{action:"challenge",wallet_address:account,chain_id:C}});if(ce)throw ce;if(ch?.error)throw new Error(ch.error);if(ch?.action==="already_verified"){st("bindState","ok","此錢包已屬於目前會員且已驗證。");await member();return}
 b.textContent="請在 Trust Wallet 簽署…";const sig=await wc.request({method:"personal_sign",params:[ch.message,account]});if(!sig)throw new Error("沒有取得簽章。");
 b.textContent="驗證簽章…";const {data:v,error:ve}=await sb.functions.invoke("bind-wallet",{body:{action:"verify",challenge_id:ch.challenge_id,signature:sig}});if(ve)throw ve;if(!v?.ok||!v?.verified)throw new Error(v?.error||"驗證失敗。");
 st("bindState","ok","✓ 綁定完成：已成為目前會員的已驗證主錢包。");await member();setTimeout(()=>location.href="./index.html?v=4142hf49e",1200);
 }catch(e){st("bindState","err","綁定失敗："+(e?.message||String(e)))}finally{b.disabled=!(ready&&account);b.textContent="簽署驗證並設為我的主錢包"}};
$("homeBtn").onclick=()=>location.href="./index.html?v=4142hf49e";await member();
</script></body></html>
