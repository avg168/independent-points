<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Independent Points V4.10.10｜會員管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box;min-width:0}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;background:#f4f7fb;touch-action:pan-y}
header{background:#10243d;color:#fff;padding:24px 18px 28px;border-radius:0 0 26px 26px}
.version{display:inline-block;margin-bottom:10px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-size:.78rem;font-weight:800}
h1{margin:0 0 8px;font-size:1.52rem}
header p{margin:0;opacity:.9;line-height:1.6}
main{max-width:820px;margin:auto;padding:16px 14px 70px}
.panel{background:#fff;border:1px solid #dde5ef;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(24,42,68,.05)}
.panel h2{margin:0 0 12px;color:#17365d;font-size:1.12rem}
.status{border-radius:12px;padding:12px 14px;line-height:1.6;background:#edf4ff;color:#27456f;border:1px solid #ccddf5}
.status.ok{background:#ebf8f2;color:#17694f;border-color:#bee5d6}
.status.warn{background:#fff7df;color:#7e5a08;border-color:#efd996}
.status.err{background:#fff0f0;color:#922c2c;border-color:#efc8c8}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:#f8fafc;border:1px solid #e1e7ef;border-radius:15px;padding:13px}
.card .k{font-size:.8rem;color:#64748b}.card .v{font-size:1.18rem;font-weight:900;color:#17365d;margin-top:4px}
.search{display:grid;grid-template-columns:1fr;gap:10px}
input,button{min-height:46px;border-radius:12px;border:1px solid #cbd5e1;padding:10px 12px;font:inherit}
button{font-weight:850;cursor:pointer}
button.primary{background:#176c59;color:#fff;border-color:#176c59}
button.blue{background:#2a5f91;color:#fff;border-color:#2a5f91}
button.light{background:#fff;color:#29445f}
button.danger{background:#a83b45;color:#fff;border-color:#a83b45}
button:disabled{opacity:.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.list{display:grid;gap:12px}
.member{border:1px solid #dbe3ed;border-radius:16px;padding:14px;background:#fff}
.member-title{font-weight:900;color:#17365d;font-size:1.02rem;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:4px 8px;border-radius:999px;font-size:.74rem;font-weight:800;background:#eef2f7;color:#475569}
.chip.ok{background:#e8f7ef;color:#17694f}.chip.admin{background:#e8efff;color:#284b88}.chip.off{background:#fdecec;color:#9b2b2b}
.meta{margin-top:10px;color:#64748b;font-size:.86rem;line-height:1.7;word-break:break-all}
.detail-grid{display:grid;grid-template-columns:1fr;gap:10px}
.detail-box{border:1px solid #e1e7ef;border-radius:13px;padding:12px;background:#f8fafc}
.detail-box .k{font-size:.77rem;color:#64748b}.detail-box .v{margin-top:4px;font-weight:800;word-break:break-all}
.audit{font-size:.82rem;line-height:1.6;border-top:1px solid #edf0f4;padding:9px 0}
.hidden{display:none!important}
@media(min-width:680px){.summary{grid-template-columns:repeat(3,1fr)}.search{grid-template-columns:1fr auto auto}.detail-grid{grid-template-columns:repeat(2,1fr)}}

.sticky-actions{
  position:sticky;top:0;z-index:30;
  background:rgba(244,247,251,.96);
  backdrop-filter:blur(8px);
  margin:-16px -14px 14px;
  padding:8px 14px;
  border-bottom:1px solid #dfe6ef;
  display:grid;grid-template-columns:1fr 1fr;gap:8px
}
.risk-note{
  border:1px solid #efd996;background:#fff7df;color:#7e5a08;
  border-radius:12px;padding:11px 13px;line-height:1.55;margin-bottom:12px
}


/* ===== product shell ===== */

  --v43-blue:#2a5f91;
  --v43-green:#176c59;
  --v43-bg:#f4f7fb;

html,body{
  width:100%;
  max-width:100%;

}
body{
  background:var(--v43-bg);
  touch-action:pan-y;
}
.v43-product-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  border-radius:999px;
  font-size:.76rem;
  font-weight:850;
  background:rgba(255,255,255,.14);
}

  margin-top:8px;
  font-size:.78rem;
  opacity:.82;
}
.v43-statusline{
  display:flex;

  background:#e8f7ef;

  left:50%;

}

  background:#eaf2fb;
  color:#17365d;
}
body{

  }

}

}

<body>
<header>
  <div class="version">V4.10.10</div>
  <h1>會員管理</h1>
  <p>Supabase 雲端會員狀態、角色、錢包驗證與管理紀錄</p>
</header>
<main>
  <div class="sticky-actions">
    <button id="stickyHomeBtn" class="light" type="button">← V4.10.10 首頁</button>
    <button id="stickyRefreshBtn" class="primary" type="button">重新整理</button>
  </div>
  <section class="panel">
    <h2>管理員狀態</h2>
    <div id="statusBox" class="status">正在載入…</div>
    <div class="actions">
      <button id="homeBtn" class="light" type="button">返回 V4.10.10 首頁</button>
      <button id="refreshBtn" class="primary" type="button">重新整理</button>
    </div>
  </section>

  <section class="panel">
    <h2>會員摘要</h2>
    <div class="summary">
      <div class="card"><div class="k">會員總數</div><div id="sTotal" class="v">—</div></div>
      <div class="card"><div class="k">正常會員</div><div id="sActive" class="v">—</div></div>
      <div class="card"><div class="k">停權會員</div><div id="sSuspended" class="v">—</div></div>
      <div class="card"><div class="k">管理員</div><div id="sAdmin" class="v">—</div></div>
      <div class="card"><div class="k">已驗證錢包</div><div id="sVerified" class="v">—</div></div>
      <div class="card"><div class="k">常用收款人</div><div id="sContacts" class="v">—</div></div>
    </div>
  </section>

  <section class="panel">
    <h2>搜尋會員</h2>
    <div class="search">
      <input id="queryInput" type="search" placeholder="會員編號／暱稱／Email／錢包地址">
      <button id="searchBtn" class="primary" type="button">搜尋</button>
      <button id="clearBtn" class="light" type="button">清除</button>
    </div>
    <div id="countNote" style="margin-top:10px;color:#64748b;font-size:.84rem"></div>
  </section>

  <section class="panel">
    <h2>會員列表</h2>
    <div class="risk-note">角色與停權操作會直接影響會員權限。系統會保護目前管理員自己與其他管理員，送出前仍請再次核對。</div>
    <div id="memberList" class="list"><div style="text-align:center;color:#64748b;padding:20px">尚未載入。</div></div>
  </section>

  <section id="detailSection" class="panel hidden">
    <h2>會員完整資料</h2>
    <div id="detailContent"></div>
    <button id="closeDetailBtn" class="light" type="button" style="margin-top:12px;width:100%">關閉詳細資料</button>
  </section>
</main>

<script>
(() => {
  const URL="https://uccexvgqmoxhgykkjdcy.supabase.co";
  const KEY="sb_publishable_FBsN1DYTQMv2_bWhpbXHAA_qdAq7ri7";
  const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const $=id=>document.getElementById(id);
  let members=[];

  function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
  function status(kind,text){const e=$("statusBox");e.className="status "+kind;e.textContent=text}
  function time(v){if(!v)return"—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleString("zh-TW",{hour12:false})}

  async function invoke(name,body){
    const {data,error}=await sb.functions.invoke(name,{body});
    if(error) throw error;
    if(data?.error) throw new Error(data.error);
    return data;
  }

  function renderSummary(s){
    $("sTotal").textContent=s.total_members??0;
    $("sActive").textContent=s.active_members??0;
    $("sSuspended").textContent=s.suspended_members??0;
    $("sAdmin").textContent=s.admin_members??0;
    $("sVerified").textContent=s.verified_wallets??0;
    $("sContacts").textContent=s.total_contacts??0;
  }

  function renderMembers(list){
    $("countNote").textContent=`顯示 ${list.length} 位會員。`;
    if(!list.length){$("memberList").innerHTML='<div style="text-align:center;color:#64748b;padding:20px">沒有符合條件的會員。</div>';return}
    $("memberList").innerHTML=list.map(m=>{
      const role=m.role==="admin"?'<span class="chip admin">管理員</span>':'<span class="chip">會員</span>';
      const st=m.status==="suspended"?'<span class="chip off">已停權</span>':'<span class="chip ok">正常</span>';
      const w=m.wallet_verified?'<span class="chip ok">錢包已驗證</span>':'<span class="chip">錢包未驗證</span>';
      const statusBtn=m.is_self||m.role==="admin"?"":(
        m.status==="suspended"
          ?`<button class="primary statusBtn" data-id="${esc(m.user_id)}" data-status="active">恢復會員</button>`
          :`<button class="danger statusBtn" data-id="${esc(m.user_id)}" data-status="suspended">停權會員</button>`
      );
      const roleBtn=m.is_self?"":(
        m.role==="admin"
          ?`<button class="light roleBtn" data-id="${esc(m.user_id)}" data-role="member">降為一般會員</button>`
          :`<button class="blue roleBtn" data-id="${esc(m.user_id)}" data-role="admin">升級為管理員</button>`
      );
      return `<article class="member">
        <div class="member-title"><span data-member-data="1">${esc(m.member_number)}｜${esc(m.display_name)}</span></div>
        <div class="chips">${role}${st}${w}</div>
        <div class="meta">
          Email：${esc(m.email||"—")}<br>
          錢包：${esc(m.wallet_address||"尚未綁定")}<br>
          常用收款人：${esc(m.contacts_count??0)} 筆<br>
          加入時間：${esc(time(m.created_at))}
        </div>
        <div class="actions">
          <button class="light detailBtn" data-id="${esc(m.user_id)}">查看詳細</button>
          ${statusBtn}
          ${roleBtn}
        </div>
      </article>`;
    }).join("");

    document.querySelectorAll(".detailBtn").forEach(b=>b.addEventListener("click",()=>loadDetail(b.dataset.id)));
    document.querySelectorAll(".statusBtn").forEach(b=>b.addEventListener("click",()=>setMemberStatus(b.dataset.id,b.dataset.status)));
    document.querySelectorAll(".roleBtn").forEach(b=>b.addEventListener("click",()=>setMemberRole(b.dataset.id,b.dataset.role)));
  }

  async function load(query=""){
    status("","正在載入會員資料…");
    try{
      const data=await invoke("admin-members",{query});
      members=data.members||[];
      renderSummary(data.summary||{});
      renderMembers(members);
      status("ok",`V4.10.10 會員管理已載入｜管理員：${data.admin?.email||"已登入"}`);
    }catch(e){
      console.error(e);
      status("err","載入失敗："+(e?.message||String(e)));
    }
  }

  async function setMemberStatus(id,newStatus){
    const label=newStatus==="suspended"?"停權":"恢復";
    if(!confirm(`確定要${label}這位會員嗎？`)) return;
    status("","正在更新會員狀態…");
    try{
      await invoke("admin-member-actions",{action:"set_status",target_user_id:id,status:newStatus,note:"會員管理中心"});
      await load($("queryInput").value.trim());
    }catch(e){status("err","更新失敗："+(e?.message||String(e)))}
  }

  async function setMemberRole(id,newRole){
    const label=newRole==="admin"?"升級為管理員":"降為一般會員";
    if(!confirm(`確定要${label}嗎？`)) return;
    status("","正在更新會員角色…");
    try{
      await invoke("admin-member-actions",{action:"set_role",target_user_id:id,role:newRole,note:"會員管理中心"});
      await load($("queryInput").value.trim());
    }catch(e){status("err","更新失敗："+(e?.message||String(e)))}
  }

  async function loadDetail(id){
    $("detailSection").classList.remove("hidden");
    $("detailContent").innerHTML='<div class="status">正在載入完整資料…</div>';
    $("detailSection").scrollIntoView({behavior:"smooth",block:"start"});
    try{
      const data=await invoke("admin-member-detail",{target_user_id:id});
      const m=data.member||{};
      const wallets=data.wallets||[];
      const contacts=data.contacts||[];
      const audit=data.audit||[];
      $("detailContent").innerHTML=`
        <div class="detail-grid">
          <div class="detail-box"><div class="k">會員</div><div class="v"><span data-member-data="1">${esc(m.member_number)}｜${esc(m.display_name)}</span></div></div>
          <div class="detail-box"><div class="k">Email</div><div class="v">${esc(m.email||"—")}</div></div>
          <div class="detail-box"><div class="k">角色／狀態</div><div class="v">${esc(m.role||"member")}／${esc(m.status||"active")}</div></div>
          <div class="detail-box"><div class="k">最近登入</div><div class="v">${esc(time(m.last_sign_in_at))}</div></div>
        </div>
        <h2 style="margin-top:20px">錢包</h2>
        ${wallets.length?wallets.map(w=>`<div class="detail-box" style="margin-bottom:8px">
          <div class="k">${esc(w.label||"錢包")}${w.is_primary?"｜主錢包":""}</div>
          <div class="v">${esc(w.wallet_address)}<br>${w.verified_at?"已驗證："+esc(time(w.verified_at)):"未驗證"}</div>
        </div>`).join(""):'<div class="detail-box"><div class="v">尚未綁定錢包</div></div>'}
        <h2 style="margin-top:20px">常用收款人</h2>
        ${contacts.length?contacts.map(c=>`<div class="detail-box" style="margin-bottom:8px"><div class="v">${esc(c.contact_name)}<br>${esc(c.wallet_address)}</div></div>`).join(""):'<div class="detail-box"><div class="v">0 筆</div></div>'}
        <h2 style="margin-top:20px">最近管理紀錄</h2>
        ${audit.length?audit.slice(0,20).map(a=>`<div class="audit">${esc(time(a.created_at))}｜${esc(a.action)}｜${esc(a.note||"")}</div>`).join(""):'<div class="detail-box"><div class="v">尚無管理紀錄</div></div>'}
      `;
    }catch(e){
      $("detailContent").innerHTML=`<div class="status err">載入失敗：${esc(e?.message||String(e))}</div>`;
    }
  }

  $("homeBtn").addEventListener("click",()=>location.href="./index.html?v=41010");
  $("refreshBtn").addEventListener("click",()=>load($("queryInput").value.trim()));
  $("stickyHomeBtn").addEventListener("click",()=>location.href="./index.html?v=41010");
  $("stickyRefreshBtn").addEventListener("click",()=>load($("queryInput").value.trim()));
  $("searchBtn").addEventListener("click",()=>load($("queryInput").value.trim()));
  $("clearBtn").addEventListener("click",()=>{$("queryInput").value="";load("")});
  $("queryInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();load($("queryInput").value.trim())}});
  $("closeDetailBtn").addEventListener("click",()=>$("detailSection").classList.add("hidden"));

  load("");
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js?v=41010",{updateViaCache:"none"}).catch(()=>{}));
}
</script>
