<!-- V4.14.2 HF12：正式首頁直接變更密碼入口 -->
<script>
(() => {
  const initHF12PasswordEntry = () => {
    if (document.getElementById("changePasswordBtn")) return;

    const loginBtn = document.getElementById("loginBtn");
    const actions = loginBtn?.closest(".actions");
    if (!actions) return;

    const btn = document.createElement("button");
    btn.id = "changePasswordBtn";
    btn.type = "button";
    btn.className = "secondary";
    btn.style.gridColumn = "1 / -1";
    btn.style.width = "100%";
    btn.textContent = "🔑 變更密碼";

    btn.addEventListener("click", () => {
      location.href = "./change-password-v4.14.2.html?v=4142hf12";
    });

    actions.appendChild(btn);
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initHF12PasswordEntry, { once: true });
  } else {
    initHF12PasswordEntry();
  }
})();
</script>
