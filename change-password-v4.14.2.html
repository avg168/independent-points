<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Independent Points｜會員變更密碼</title>
<script>
window.IPT_SUPABASE_READY=(async()=>{
  if(window.supabase?.createClient) return window.supabase;
  const sources=[
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js",
    "https://unpkg.com/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js",
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"
  ];
  let lastError=null;
  for(const src of sources){
    try{
      await new Promise((resolve,reject)=>{
        const tag=document.createElement("script");
        let done=false;
        const finish=(err)=>{
          if(done)return; done=true; clearTimeout(timer);
          if(err){try{tag.remove()}catch(_){} reject(err)}else resolve();
        };
        const timer=setTimeout(()=>finish(new Error("Supabase JS 載入逾時")),5000);
        tag.src=src; tag.async=true; tag.crossOrigin="anonymous";
        tag.onload=()=>window.supabase?.createClient?finish():finish(new Error("Supabase JS 初始化失敗"));
        tag.onerror=()=>finish(new Error("Supabase JS 載入失敗"));
        document.head.appendChild(tag);
      });
      if(window.supabase?.createClient) return window.supabase;
    }catch(e){lastError=e}
  }
  throw lastError||new Error("Supabase JS 無法載入");
})();
</script>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box;min-width:0}body{margin:0;background:#f4f7fb}header{background:#10243d;color:white;padding:24px 18px 30px;border-radius:0 0 26px 26px}
.version{display:inline-block;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:999px;font-size:.8rem;font-weight:800;margin-bottom:10px}
h1{font-size:1.6rem;margin:0 0 10px}header p{margin:0;line-height:1.6;opacity:.92}
main{max-width:760px;margin:auto;padding:16px 14px 72px}.panel{background:white;border:1px solid #dde5ef;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(24,42,68,.05)}
h2{font-size:1.15rem;color:#17365d;margin:0 0 12px}.status{border-radius:12px;padding:12px 14px;line-height:1.6;background:#edf4ff;color:#27456f;border:1px solid #ccddf5}
.status.ok{background:#ebf8f2;color:#17694f;border-color:#bee5d6}.status.warn{background:#fff7df;color:#7e5a08;border-color:#efd996}.status.err{background:#fff0f0;color:#922c2c;border-color:#efc8c8}
input,button{width:100%;min-height:52px;border-radius:12px;border:1px solid #cbd5e1;padding:11px 13px;font:inherit;margin-top:10px}
button{font-weight:850;cursor:pointer}button.primary{background:#176c59;color:#fff;border-color:#176c59}button.blue{background:#2a5f91;color:#fff;border-color:#2a5f91}button.light{background:#fff;color:#29445f}
button:disabled{opacity:.55;cursor:not-allowed}.note{font-size:.86rem;color:#64748b;line-height:1.7;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.card{background:#f8fafc;border:1px solid #e1e7ef;border-radius:14px;padding:13px}.k{font-size:.78rem;color:#64748b}.v{font-weight:850;margin-top:5px;word-break:break-all}
.langbar{display:flex;gap:8px;margin-top:14px}.langbar button{width:auto;min-height:40px;margin:0;padding:7px 12px;background:#fff;color:#17365d}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="version">V4.14.2｜HF16</div>
  <h1 id="title">會員變更密碼</h1>
  <p id="subtitle">獨立密碼管理頁。登入、確認 MFA 後即可變更，不需要再到其他區塊尋找。</p>
  <div class="langbar">
    <button type="button" data-lang="zh-TW">繁中</button>
    <button type="button" data-lang="zh-CN">简中</button>
    <button type="button" data-lang="en">English</button>
  </div>
</header>
<main>
  <section class="panel">
    <h2 id="hState">目前狀態</h2>
    <div id="state" class="status">正在確認登入狀態…</div>
    <div class="grid">
      <div class="card"><div class="k">Email</div><div id="email" class="v">—</div></div>
      <div class="card"><div class="k" id="kAal">驗證等級</div><div id="aal" class="v">—</div></div>
    </div>
  </section>

  <section class="panel" id="loginPanel">
    <h2 id="hLogin">會員登入</h2>
    <input id="loginEmail" type="email" autocomplete="username" placeholder="會員 Email">
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="登入密碼">
    <button id="loginBtn" class="primary" type="button">登入</button>
    <div class="note" id="loginNote">若目前已登入，本區可以不用再輸入。</div>
  </section>

  <section class="panel">
    <h2 id="hPassword">變更密碼</h2>
    <div id="passwordStatus" class="status warn">請先完成登入狀態確認。</div>
    <input id="currentPassword" type="password" autocomplete="current-password" placeholder="目前密碼">
    <input id="newPassword" type="password" autocomplete="new-password" placeholder="新密碼">
    <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次輸入新密碼">
    <button id="changePasswordBtn" class="primary" type="button" disabled>變更密碼</button>
    <button id="mfaBtn" class="blue" type="button" style="display:none">前往完成 MFA</button>
    <div class="note" id="passwordNote">新密碼至少 8 個字元。若帳號已設定 MFA，本次登入必須先完成 AAL2。</div>
  </section>

  <section class="panel">
    <button id="securityBtn" class="light" type="button">返回帳戶安全</button>
    <button id="homeBtn" class="light" type="button">返回首頁</button>
  </section>
</main>

<script>
(async()=>{
  "use strict";
  const URL="https://uccexvgqmoxhgykkjdcy.supabase.co";
  const KEY="sb_publishable_FBsN1DYTQMv2_bWhpbXHAA_qdAq7ri7";
  const $=id=>document.getElementById(id);
  let lang="zh-TW", sb=null, currentUser=null, currentSession=null, verifiedFactors=[];

  try{lang=localStorage.getItem("ipt_language")||"zh-TW"}catch(_){}

  const S={
    "zh-TW":{
      title:"會員變更密碼",subtitle:"獨立密碼管理頁。登入、確認 MFA 後即可變更，不需要再到其他區塊尋找。",
      hState:"目前狀態",checking:"正在確認登入狀態…",notLogin:"目前尚未登入。",ready:"已登入，可以變更密碼。",
      needMfa:"此帳號已設定 MFA，請先完成本次登入的 AAL2 驗證。",hLogin:"會員登入",loginEmail:"會員 Email",loginPassword:"登入密碼",login:"登入",
      loginNote:"若目前已登入，本區可以不用再輸入。",hPassword:"變更密碼",currentPassword:"目前密碼",newPassword:"新密碼",confirmPassword:"再次輸入新密碼",
      change:"變更密碼",mfa:"前往完成 MFA",passwordNote:"新密碼至少 8 個字元。若帳號已設定 MFA，本次登入必須先完成 AAL2。",
      missing:"請完整輸入目前密碼、新密碼與確認密碼。",short:"新密碼至少需要 8 個字元。",mismatch:"兩次輸入的新密碼不一致。",
      same:"新密碼不能與目前密碼相同。",changing:"正在驗證目前密碼並更新…",changed:"密碼已成功變更。",fail:"密碼變更失敗：",
      loginFail:"登入失敗：",security:"返回帳戶安全",home:"返回首頁",kAal:"驗證等級"
    },
    "zh-CN":{
      title:"会员变更密码",subtitle:"独立密码管理页。登录、确认 MFA 后即可变更，不需要再到其他区块寻找。",
      hState:"当前状态",checking:"正在确认登录状态…",notLogin:"目前尚未登录。",ready:"已登录，可以变更密码。",
      needMfa:"此账号已设置 MFA，请先完成本次登录的 AAL2 验证。",hLogin:"会员登录",loginEmail:"会员 Email",loginPassword:"登录密码",login:"登录",
      loginNote:"若目前已登录，本区可以不用再输入。",hPassword:"变更密码",currentPassword:"当前密码",newPassword:"新密码",confirmPassword:"再次输入新密码",
      change:"变更密码",mfa:"前往完成 MFA",passwordNote:"新密码至少 8 个字符。若账号已设置 MFA，本次登录必须先完成 AAL2。",
      missing:"请完整输入当前密码、新密码与确认密码。",short:"新密码至少需要 8 个字符。",mismatch:"两次输入的新密码不一致。",
      same:"新密码不能与当前密码相同。",changing:"正在验证当前密码并更新…",changed:"密码已成功变更。",fail:"密码变更失败：",
      loginFail:"登录失败：",security:"返回账户安全",home:"返回首页",kAal:"验证等级"
    },
    "en":{
      title:"Change Member Password",subtitle:"Dedicated password page. Sign in, complete MFA when required, then change your password here.",
      hState:"Current Status",checking:"Checking sign-in status…",notLogin:"You are not signed in.",ready:"Signed in. Password change is available.",
      needMfa:"MFA is configured. Complete AAL2 for this sign-in first.",hLogin:"Member Sign In",loginEmail:"Member Email",loginPassword:"Sign-in password",login:"Sign In",
      loginNote:"If you are already signed in, you do not need to enter this again.",hPassword:"Change Password",currentPassword:"Current password",newPassword:"New password",confirmPassword:"Confirm new password",
      change:"Change Password",mfa:"Complete MFA",passwordNote:"The new password must be at least 8 characters. If MFA is configured, this sign-in must first reach AAL2.",
      missing:"Enter the current password, new password, and confirmation.",short:"The new password must be at least 8 characters.",mismatch:"The two new-password entries do not match.",
      same:"The new password must differ from the current password.",changing:"Verifying current password and updating…",changed:"Password changed successfully.",fail:"Password change failed: ",
      loginFail:"Sign-in failed: ",security:"Back to Account Security",home:"Back Home",kAal:"Assurance Level"
    }
  };

  const T=k=>(S[lang]||S["zh-TW"])[k]||k;
  function setStatus(kind,text){$("state").className="status"+(kind?" "+kind:"");$("state").textContent=text}
  function setPassword(kind,text){$("passwordStatus").className="status"+(kind?" "+kind:"");$("passwordStatus").textContent=text}
  async function timeout(p,ms,label){
    let timer;
    try{
      return await Promise.race([
        p,
        new Promise((_,reject)=>timer=setTimeout(()=>reject(new Error((label||"Operation")+" timeout")),ms))
      ]);
    }finally{clearTimeout(timer)}
  }

  function applyLang(){
    try{localStorage.setItem("ipt_language",lang)}catch(_){}
    document.documentElement.lang=lang==="en"?"en":(lang==="zh-CN"?"zh-Hans":"zh-Hant");
    for(const id of ["title","subtitle","hState","hLogin","loginNote","hPassword","passwordNote"]){
      if($(id)) $(id).textContent=T(id);
    }
    $("loginEmail").placeholder=T("loginEmail");
    $("loginPassword").placeholder=T("loginPassword");
    $("loginBtn").textContent=T("login");
    $("currentPassword").placeholder=T("currentPassword");
    $("newPassword").placeholder=T("newPassword");
    $("confirmPassword").placeholder=T("confirmPassword");
    $("changePasswordBtn").textContent=T("change");
    $("mfaBtn").textContent=T("mfa");
    $("securityBtn").textContent=T("security");
    $("homeBtn").textContent=T("home");
    $("kAal").textContent=T("kAal");
  }

  async function refresh(sessionHint=null,userHint=null){
    $("changePasswordBtn").disabled=true;
    $("mfaBtn").style.display="none";
    setStatus("",T("checking"));

    currentSession=sessionHint||null;
    currentUser=userHint||null;

    if(!currentSession){
      const sr=await timeout(sb.auth.getSession(),8000,"Session");
      if(sr?.error) throw sr.error;
      currentSession=sr?.data?.session||null;
    }

    if(!currentUser && currentSession){
      const ur=await timeout(sb.auth.getUser(currentSession.access_token),8000,"User");
      if(ur?.error) throw ur.error;
      currentUser=ur?.data?.user||null;
    }

    if(!currentSession||!currentUser){
      $("email").textContent="—"; $("aal").textContent="—";
      setStatus("warn",T("notLogin")); setPassword("warn",T("notLogin"));
      return;
    }

    $("email").textContent=currentUser.email||"—";

    const aalRes=await timeout(
      sb.auth.mfa.getAuthenticatorAssuranceLevel(currentSession.access_token),
      8000,"MFA"
    );
    if(aalRes?.error) throw aalRes.error;

    const factorRes=await timeout(sb.auth.mfa.listFactors(),8000,"MFA factors");
    if(factorRes?.error) throw factorRes.error;

    const aal=aalRes?.data||null;
    verifiedFactors=(factorRes?.data?.totp||[]).filter(f=>f.status==="verified");
    $("aal").textContent=aal?.currentLevel||"aal1";

    if(verifiedFactors.length && aal?.currentLevel!=="aal2"){
      setStatus("warn",T("needMfa")); setPassword("warn",T("needMfa"));
      $("mfaBtn").style.display="";
      return;
    }

    setStatus("ok",T("ready")); setPassword("ok",T("ready"));
    $("changePasswordBtn").disabled=false;
  }

  document.querySelectorAll("[data-lang]").forEach(btn=>{
    btn.onclick=()=>{lang=btn.dataset.lang;applyLang();refresh().catch(e=>setStatus("err",e?.message||String(e)))}
  });

  $("loginBtn").onclick=async()=>{
    const email=$("loginEmail").value.trim();
    const password=$("loginPassword").value;
    if(!email||!password)return;
    $("loginBtn").disabled=true;
    try{
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error)throw error;
      $("loginPassword").value="";
      try{localStorage.setItem("ipt_last_login_email",email)}catch(_){}
      await refresh(data?.session||null,data?.user||null);
    }catch(e){
      setStatus("err",T("loginFail")+(e?.message||String(e)));
    }finally{$("loginBtn").disabled=false}
  };

  $("changePasswordBtn").onclick=async()=>{
    const current=$("currentPassword").value;
    const next=$("newPassword").value;
    const confirmNext=$("confirmPassword").value;
    if(!current||!next||!confirmNext){setPassword("warn",T("missing"));return}
    if(next.length<8){setPassword("warn",T("short"));return}
    if(next!==confirmNext){setPassword("warn",T("mismatch"));return}
    if(next===current){setPassword("warn",T("same"));return}
    if(!currentUser?.email||!currentSession){setPassword("warn",T("notLogin"));return}

    $("changePasswordBtn").disabled=true;
    setPassword("",T("changing"));

    try{
      const verifier=window.supabase.createClient(URL,KEY,{
        auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}
      });
      const vr=await timeout(
        verifier.auth.signInWithPassword({email:currentUser.email,password:current}),
        8000,"Verify current password"
      );
      if(vr?.error)throw vr.error;

      const ur=await timeout(
        sb.auth.updateUser({current_password:current,password:next}),
        10000,"Change password"
      );
      if(ur?.error)throw ur.error;

      $("currentPassword").value="";
      $("newPassword").value="";
      $("confirmPassword").value="";
      setPassword("ok",T("changed"));
      $("changePasswordBtn").disabled=false;
    }catch(e){
      setPassword("err",T("fail")+(e?.message||String(e)));
      $("changePasswordBtn").disabled=false;
    }
  };

  $("mfaBtn").onclick=()=>location.href="./auth-security-v4.14.2.html?v=4142hf16#mfa";
  $("securityBtn").onclick=()=>location.href="./auth-security-v4.14.2.html?v=4142hf16";
  $("homeBtn").onclick=()=>location.href="https://avg168.github.io/independent-points/?v=4142hf16";

  try{
    const last=localStorage.getItem("ipt_last_login_email");
    if(last)$("loginEmail").value=last;
  }catch(_){}

  try{
    await window.IPT_SUPABASE_READY;
    sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    applyLang();
    await refresh();
  }catch(e){
    console.error("[IPT HF16 password page]",e);
    setStatus("err","啟動失敗："+(e?.message||String(e)));
    setPassword("err","啟動失敗："+(e?.message||String(e)));
  }
})();
</script>
</body>
</html>
