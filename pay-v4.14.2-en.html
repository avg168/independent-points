<!doctype html>
<html lang="zh-Hant">
<head>
<script>try{localStorage.setItem("ipt_language","en")}catch(_){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Independent Points | Platform IPT Receive</title>
<meta name="description" content="Verify the recipient and member number, then sign in to transfer Platform IPT. Opening this link does not send a payment.">
<meta property="og:title" content="Independent Points | Platform IPT Receive">
<meta property="og:description" content="Verify the recipient and member number, then sign in to transfer Platform IPT. Opening this link does not send a payment.">
<meta property="og:type" content="website">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0;background:#f4f7fb}
header{background:linear-gradient(145deg,#10243d,#174e87);color:#fff;padding:26px 20px 30px;border-radius:0 0 28px 28px}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-size:.78rem;font-weight:900}
h1{margin:10px 0 6px;font-size:1.55rem}header p{margin:0;opacity:.9;line-height:1.6}
main{max-width:680px;margin:auto;padding:18px 14px 60px}
.card{background:#fff;border:1px solid #dbe3ed;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 18px rgba(24,42,68,.05)}
.payee{text-align:center;padding:20px;border-radius:18px;background:#edf9f3;border:1px solid #bee5d6}
.k{font-size:.86rem;color:#687486;font-weight:800}
.name{font-size:1.7rem;font-weight:900;color:#17694f;margin:10px 0 4px}
.number{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.05rem;color:#526170}
.status{padding:13px 14px;border-radius:13px;line-height:1.6;margin:12px 0}
.info{background:#eef4ff;border-left:5px solid #3777d6}.ok{background:#eaf8f0;border-left:5px solid #18866d}
.warn{background:#fff6df;border-left:5px solid #d49a0a}.err{background:#ffecec;border-left:5px solid #c93030}
button{width:100%;border:0;border-radius:14px;padding:16px 14px;font:inherit;font-weight:900;min-height:52px;touch-action:manipulation}
.primary{background:#1765d8;color:#fff}button:disabled{opacity:.45}
.note{font-size:.86rem;color:#687486;line-height:1.65}
</style>
<script src="https://avg168.github.io/independent-points/i18n-v4.10.js?v=4142hf50c8" defer></script>
</head>
<body>
<header>
  <span class="badge">V4.14.2｜公開收款確認</span>
  <h1>Independent Points</h1>
  <p>先確認收款人，再登入自己的會員帳號完成平台 IPT 付款。</p>
</header>
<main>
  <section class="card">
    <h2 style="margin:0 0 14px">平台 IPT 收款</h2>
    <div id="payeeBox" class="payee">
      <div class="k">正在確認收款人</div>
      <div id="payeeName" data-member-data="1" class="name">—</div>
      <div id="payeeNumber" class="number">—</div>
    </div>
    <div id="status" class="status info">正在安全解析收款連結…</div>
    <button id="payBtn" class="primary" type="button" disabled>登入後付款</button>
    <p class="note">
      此頁不顯示收款人的 Email、密碼、Trust Wallet 私鑰或資產餘額。
      掃描 QR Code 不會直接扣款；付款前仍需登入、必要的 MFA／受信任裝置驗證，以及最後一次轉帳確認。
    </p>
  </section>
</main>
<script>
(() => {
  "use strict";
  const URL="https://uccexvgqmoxhgykkjdcy.supabase.co";
  const KEY="sb_publishable_FBsN1DYTQMv2_bWhpbXHAA_qdAq7ri7";
  const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const $=id=>document.getElementById(id);
  let token="", recipient=null;

  function validToken(v){return /^[A-Za-z0-9_-]{43}$/.test(v)}

  async function boot(){
    token=String(new URLSearchParams(location.search).get("t")||"").trim();
    if(!validToken(token)){
      $("status").className="status err";
      $("status").textContent="這個收款連結無效或不完整。";
      return;
    }

    try{
      const {data,error}=await sb.functions.invoke("platform-payment-link",{
        body:{action:"resolve",token}
      });
      if(error) throw error;
      if(data?.error) throw new Error(data.error);
      if(!data?.recipient?.member_number) throw new Error("Payment link unavailable");

      recipient=data.recipient;
      $("payeeName").textContent=recipient.display_name||"IPT 會員";
      $("payeeNumber").textContent=recipient.member_number;
      $("status").className="status ok";
      $("status").textContent="收款人已由伺服器確認。請核對後再登入自己的會員帳號付款。";
      $("payBtn").disabled=false;
    }catch(e){
      console.error(e);
      $("status").className="status err";
      $("status").textContent="這個收款連結目前無法使用，請向收款人索取新的 QR Code。";
    }
  }

  $("payBtn").addEventListener("click",()=>{
    if(!recipient||!validToken(token)) return;
    const next="/independent-points/wallet-dual-v4.14.2.html?t="+
      encodeURIComponent(token)+"&v=4142";

    // Android/LINE/in-app browsers may occasionally lose nested query params.
    // Keep a same-origin localStorage fallback so login/MFA can still return.
    try{
      localStorage.setItem("ipt_pending_pay_token_v41342",token);
      localStorage.setItem("ipt_pending_pay_next_v41342",next);
      localStorage.setItem("ipt_pending_pay_saved_at_v41342",String(Date.now()));
    }catch(_){}

    location.href=
      "https://avg168.github.io/independent-points/auth-security-v4.14.2.html?next="+
      encodeURIComponent(next);
  });

  boot();
})();
</script>
</body>
</html>
