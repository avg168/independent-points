<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#172033}
*{box-sizing:border-box}
body{margin:0;background:#eef2f7}
.top{position:sticky;top:0;z-index:5;background:#10243d;color:#fff;padding:14px}
.top-inner{max-width:900px;margin:auto}
.top h1{font-size:1.1rem;margin:0 0 8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{min-height:46px;border-radius:12px;border:0;font:inherit;font-weight:900}
.print{background:#176c59;color:#fff}.back{background:#fff;color:#29445f}
.note{font-size:.8rem;line-height:1.5;opacity:.9;margin-top:8px}
main{max-width:900px;margin:auto;padding:18px}
.sheet{background:#fff;border:1px solid #dbe3ed;border-radius:16px;padding:20px}
h2{color:#17365d;margin:0 0 14px} h3{color:#17365d;margin:22px 0 10px}
.meta{line-height:1.7;color:#526071}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.card{border:1px solid #dde5ef;border-radius:12px;padding:12px}
.card .k{font-size:.78rem;color:#64748b}.card .v{font-size:1.05rem;font-weight:900;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{border:1px solid #dbe3ed;padding:7px;vertical-align:top;word-break:break-all}
th{background:#f4f7fb;text-align:left}
.empty{padding:20px;text-align:center;color:#64748b}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media print{
  body{background:#fff}.top{display:none!important}main{padding:0;max-width:none}
  .sheet{border:0;border-radius:0;padding:0} .card,table,tr{break-inside:avoid}
}

/* V4.14.2 print preview mobile lock */
html,body{
  width:100%;
  max-width:100%;
  overflow-x:hidden!important;
  overscroll-behavior-x:none;
}
body{
  position:relative;
  touch-action:pan-y;
}
.top{
  left:0;
  right:0;
  width:100%;
  max-width:100%;
}
.top-inner,main,.sheet{
  width:100%;
  max-width:100%;
  min-width:0;
}
.sheet{
  overflow:hidden;
}
.meta{
  max-width:100%;
  overflow-wrap:anywhere!important;
  word-break:break-word!important;
  white-space:normal!important;
}
.actions{
  width:100%;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
}
.actions>*{
  min-width:0;
  width:100%;
}
table{
  width:100%!important;
  max-width:100%!important;
  table-layout:fixed!important;
  font-size:.72rem;
}
th,td{
  max-width:1px;
  overflow-wrap:anywhere!important;
  word-break:break-word!important;
  white-space:normal!important;
  padding:5px;
}
@media(max-width:480px){
  main{padding:12px}
  .sheet{padding:14px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card{padding:10px}
  .card .v{font-size:.95rem}
  .meta{font-size:.88rem}
  h2{font-size:1.35rem}
  h3{font-size:1.05rem}
}


/* ===== product shell ===== */
:root{
  --v43-navy:#10243d;
  --v43-blue:#2a5f91;
  --v43-green:#176c59;

  width:100%;
  max-width:100%;

body{
  background:var(--v43-bg);
  touch-action:pan-y;
}
.v43-product-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  border-radius:999px;
  font-size:.76rem;
  font-weight:850;

}

}

}

}
.v43-bottom-nav{

  grid-template-columns:repeat(4,minmax(0,1fr));

  background:rgba(255,255,255,.94);

  min-height:48px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#29445f;
  font:inherit;
  font-size:.78rem;
  font-weight:850;
  padding:6px 4px;
  touch-action:manipulation;
}
.v43-bottom-nav button.active{
  background:#eaf2fb;
  color:#17365d;
}
body{
  padding-bottom:calc(82px + env(safe-area-inset-bottom));
}
@media(min-width:760px){

/* ===== V4.14.2 reliable in-page navigation ===== */
.v43-bottom-nav{

}
body{

}

:root{

}
html{

/* HF50-C38: readable mobile tables and full-width print output */
.table-note{font-size:.8rem;color:#64748b;margin:0 0 10px}
.table-scroll{width:100%;max-width:100%;overflow-x:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.table-scroll table{width:100%!important;min-width:760px;max-width:none!important;table-layout:auto!important;font-size:.82rem}
.table-scroll th,.table-scroll td{max-width:none;word-break:normal!important;overflow-wrap:normal!important;white-space:normal!important;padding:8px}

.meta{word-break:normal!important;overflow-wrap:anywhere!important}
@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{overflow:visible!important;width:auto;max-width:none}
  .table-note,.ipt-langbar{display:none!important}

  /* Keep section headings with the first rows; let long tables paginate. */
  h3{break-after:avoid;page-break-after:avoid}

  table{break-inside:auto;page-break-inside:auto}

<body>
<div class="top" data-raw-data="1">
  <div class="top-inner">
    <div class="v43-product-tag">V4.14.2 | HF50-C38</div>
    <h1>列印／PDF 預覽</h1>
    <div class="actions">
      <button id="printBtn" class="print" type="button">開啟系統列印／另存 PDF</button>
      <button id="backBtn" class="back" type="button">返回報表</button>
    </div>
    <div id="printNote" class="note">
      若 Android 沒有跳出系統列印畫面，仍可在此預覽報表；可再使用瀏覽器右上角選單的分享／列印功能。
    </div>
  </div>
</div>
<main>
  <div id="tableNote" class="table-note" data-raw-data="1"></div>
  <div id="sheet" class="sheet" data-raw-data="1"></div>
</main>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const raw=sessionStorage.getItem("ipt_print_report");
  let report=null;
  try{report=raw?JSON.parse(raw):null}catch(_){}

  function esc(v){
    return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }
  function time(v){
    if(!v) return "—";
    const d=typeof v==="number"?new Date(v*1000):new Date(v);
    return Number.isNaN(d.getTime())?"—":d.toLocaleString("zh-TW",{hour12:false});
  }
  function fmt6(v){
    const n=Number(String(v??"0").replace(" IPT",""));
    if(!Number.isFinite(n)) return String(v??"0");
    return n.toLocaleString("zh-TW",{minimumFractionDigits:6,maximumFractionDigits:6});
  }

  function shortAddr(a){
    if(!a) return "—";
    return a.length<20?a:a.slice(0,10)+"…"+a.slice(-8);
  }


  const TEXTS = [["列印／PDF 預覽", "打印／PDF 预览", "Print / PDF Preview"], ["開啟系統列印／另存 PDF", "打开系统打印／另存 PDF", "Open System Print / Save PDF"], ["返回報表", "返回报表", "Back to Report"], ["若 Android 沒有跳出系統列印畫面，仍可在此預覽報表；可再使用瀏覽器右上角選單的分享／列印功能。", "若 Android 没有打开系统打印界面，仍可在此预览报表；可使用浏览器菜单的分享／打印功能。", "If Android does not open the system print dialog, preview the report here and use the browser menu for Share / Print."], ["找不到列印資料，請返回資產報表重新按「列印／PDF 預覽」。", "找不到打印数据，请返回资产报表重新点击“打印／PDF 预览”。", "No print data found. Return to the asset report and select Print / PDF Preview again."], ["我的資產報表", "我的资产报表", "My Asset Report"], ["管理員資產彙總報表", "管理员资产汇总报表", "Administrator Asset Summary Report"], ["版本", "版本", "Version"], ["產生時間", "生成时间", "Generated At"], ["會員", "会员", "Member"], ["錢包", "钱包", "Wallet"], ["尚未綁定", "尚未绑定", "Not Linked"], ["篩選", "筛选", "Filters"], ["會員搜尋", "会员搜索", "Member Search"], ["全部", "全部", "All"], ["全部交易", "全部交易", "All Transactions"], ["目前餘額", "当前余额", "Current Balance"], ["累計轉入", "累计转入", "Total Incoming"], ["累計轉出", "累计转出", "Total Outgoing"], ["資產淨變動", "资产净变化", "Net Asset Change"], ["交易筆數", "交易笔数", "Transactions"], ["符合會員數", "符合会员数", "Matching Members"], ["區間轉入", "区间转入", "Incoming During Period"], ["區間轉出", "区间转出", "Outgoing During Period"], ["區間淨變動", "区间净变化", "Net Change During Period"], ["資產變動筆數", "资产变动笔数", "Asset Transactions"], ["會員區間彙總", "会员区间汇总", "Member Summary for Period"], ["交易紀錄", "交易记录", "Transaction History"], ["類型", "类型", "Type"], ["時間", "时间", "Time"], ["數量", "数量", "Amount"], ["區塊", "区块", "Block"], ["轉入", "转入", "Incoming"], ["轉出", "转出", "Outgoing"], ["淨變動", "净变化", "Net Change"], ["筆數", "笔数", "Count"], ["無交易紀錄", "无交易记录", "No transactions"], ["無會員資料", "无会员数据", "No member data"], ["Mint 收入", "Mint 收入", "Mint Received"], ["Burn 支出", "Burn 支出", "Burn Sent"], ["其他", "其他", "Other"], ["已送出系統列印要求。若仍沒有跳出，請使用右上角選單的分享／列印功能。", "已发送系统打印请求。若仍未打开，请使用浏览器菜单的分享／打印功能。", "System print requested. If the dialog does not open, use the browser menu for Share / Print."], ["此瀏覽器不支援 window.print()。請使用右上角選單的分享／列印功能。", "此浏览器不支持 window.print()。请使用浏览器菜单的分享／打印功能。", "This browser does not support window.print(). Use the browser menu for Share / Print."], ["手機可左右滑動表格查看完整欄位。", "手机可左右滑动表格查看完整字段。", "Swipe tables horizontally to view all columns."]];
  function lang(){return window.IPTI18N?.getLang?.() || localStorage.getItem("ipt_language") || "zh-TW";}
  function tr(value){
    const row=TEXTS.find(r=>r.includes(value));
    return row?row[lang()==="en"?2:lang()==="zh-CN"?1:0]:String(value??"");
  }
  function txLabel(value){
    const labels={mint:"Mint 收入",burn:"Burn 支出",in:"轉入",incoming:"轉入",out:"轉出",outgoing:"轉出",other:"其他"};
    return tr(labels[value]||value||"其他");
  }
  function render(){
    document.title="Independent Points｜"+tr("列印／PDF 預覽");
    document.documentElement.dataset.iptOriginalTitle=document.title;
    document.querySelector(".top h1").textContent=tr("列印／PDF 預覽");
    $("printBtn").textContent=tr("開啟系統列印／另存 PDF");
    $("backBtn").textContent=tr("返回報表");
    $("printNote").textContent=tr("若 Android 沒有跳出系統列印畫面，仍可在此預覽報表；可再使用瀏覽器右上角選單的分享／列印功能。");
    $("tableNote").textContent=tr("手機可左右滑動表格查看完整欄位。");
  if(!report){
    $("sheet").innerHTML=`<div class="empty">${esc(tr("找不到列印資料，請返回資產報表重新按「列印／PDF 預覽」。"))}</div>`;
  }else if(report.kind==="member"){
    const m=report.member||{},s=report.summary||{},f=report.filters||{},txs=report.transactions||[];
    $("sheet").innerHTML=`
      <h2>${esc(tr(report.title||"我的資產報表"))}</h2>
      <div class="meta">
        ${esc(tr("版本"))}: ${esc(report.version||"")}<br>
        ${esc(tr("產生時間"))}: ${esc(time(report.generated_at))}<br>
        ${esc(tr("會員"))}: <span data-member-data="1">${esc(m.member_number)}｜${esc(m.display_name)}</span><br>
        Email：${esc(m.email)}<br>
        ${esc(tr("錢包"))}: <span style="overflow-wrap:anywhere;word-break:break-word">${esc(m.wallet_address||tr("尚未綁定"))}</span><br>
        ${esc(tr("篩選"))}: ${esc(f.from||tr("全部"))} ～ ${esc(f.to||tr("全部"))}｜${esc(tr(f.type||"全部交易"))}
      </div>
      <div class="grid">
        <div class="card"><div class="k">${esc(tr("目前餘額"))}</div><div class="v">${esc(fmt6(s.current_balance))} IPT</div></div>
        <div class="card"><div class="k">${esc(tr("累計轉入"))}</div><div class="v">${esc(fmt6(s.incoming))} IPT</div></div>
        <div class="card"><div class="k">${esc(tr("累計轉出"))}</div><div class="v">${esc(fmt6(s.outgoing))} IPT</div></div>
        <div class="card"><div class="k">${esc(tr("資產淨變動"))}</div><div class="v">${esc(fmt6(s.net))} IPT</div></div>
        <div class="card"><div class="k">${esc(tr("交易筆數"))}</div><div class="v">${esc(s.count)}</div></div>
        <div class="card"><div class="k">Mint / Burn</div><div class="v">${esc(s.mint_burn)}</div></div>
      </div>
      <h3>${esc(tr("交易紀錄"))}</h3>
      ${txs.length?`<div class="table-scroll" tabindex="0" role="region" aria-label="${esc(tr("交易紀錄"))}"><table><thead><tr><th>${esc(tr("類型"))}</th><th>${esc(tr("時間"))}</th><th>${esc(tr("數量"))}</th><th>From</th><th>To</th><th>${esc(tr("區塊"))}</th></tr></thead><tbody>${
        txs.map(tx=>`<tr><td>${esc(txLabel(tx.type))}</td><td>${esc(time(tx.timestamp))}</td><td class="number">${esc(fmt6(tx.amount))} IPT</td><td>${esc(shortAddr(tx.from))}</td><td>${esc(shortAddr(tx.to))}</td><td>${esc(tx.block_number)}</td></tr>`).join("")
      }</tbody></table></div>`:`<div class="empty">${esc(tr("無交易紀錄"))}</div>`}
    `;
  }else{
    const c=report.criteria||{},s=report.summary||{},members=report.members||[],txs=report.transactions||[];
    $("sheet").innerHTML=`
      <h2>${esc(tr(report.title||"管理員資產彙總報表"))}</h2>
      <div class="meta">
        ${esc(tr("版本"))}: ${esc(report.version||"")}<br>
        ${esc(tr("產生時間"))}: ${esc(time(report.generated_at))}<br>
        ${esc(tr("篩選"))}: ${esc(c.from||tr("全部"))} ～ ${esc(c.to||tr("全部"))}｜${esc(tr(c.type||"全部交易"))}｜${esc(tr("會員搜尋"))}: ${esc(c.query||tr("全部"))}
      </div>
      <div class="grid">
        <div class="card"><div class="k">${esc(tr("符合會員數"))}</div><div class="v">${esc(s.members)}</div></div>
        <div class="card"><div class="k">${esc(tr("區間轉入"))}</div><div class="v">${esc(fmt6(s.incoming))} IPT</div></div>
        <div class="card"><div class="k">${esc(tr("區間轉出"))}</div><div class="v">${esc(fmt6(s.outgoing))} IPT</div></div>
        <div class="card"><div class="k">${esc(tr("區間淨變動"))}</div><div class="v">${esc(fmt6(s.net))} IPT</div></div>
        <div class="card"><div class="k">${esc(tr("資產變動筆數"))}</div><div class="v">${esc(s.count)}</div></div>
        <div class="card"><div class="k">Mint / Burn</div><div class="v">${esc(s.mint)} / ${esc(s.burn)}</div></div>
      </div>
      <h3>${esc(tr("會員區間彙總"))}</h3>
      ${members.length?`<div class="table-scroll" tabindex="0" role="region" aria-label="${esc(tr("會員區間彙總"))}"><table><thead><tr><th>${esc(tr("會員"))}</th><th>${esc(tr("目前餘額"))}</th><th>${esc(tr("轉入"))}</th><th>${esc(tr("轉出"))}</th><th>${esc(tr("淨變動"))}</th><th>${esc(tr("筆數"))}</th></tr></thead><tbody>${
        members.map(x=>`<tr><td>${esc(x.member?.member_number)}｜${esc(x.member?.display_name)}</td><td class="number">${esc(fmt6(x.member?.ipt_balance))} IPT</td><td class="number">${esc(fmt6(x.incoming))} IPT</td><td class="number">${esc(fmt6(x.outgoing))} IPT</td><td class="number">${esc(fmt6(x.net))} IPT</td><td>${esc(x.count)}</td></tr>`).join("")
      }</tbody></table></div>`:`<div class="empty">${esc(tr("無會員資料"))}</div>`}
      <h3>${esc(tr("交易紀錄"))}</h3>
      ${txs.length?`<div class="table-scroll" tabindex="0" role="region" aria-label="${esc(tr("交易紀錄"))}"><table><thead><tr><th>${esc(tr("會員"))}</th><th>${esc(tr("類型"))}</th><th>${esc(tr("時間"))}</th><th>${esc(tr("數量"))}</th><th>${esc(tr("區塊"))}</th></tr></thead><tbody>${
        txs.map(x=>`<tr><td>${esc(x.member?.member_number)}｜${esc(x.member?.display_name)}</td><td>${esc(txLabel(x.tx?.type))}</td><td>${esc(time(x.tx?.timestamp))}</td><td class="number">${esc(fmt6(x.tx?.amount))} IPT</td><td>${esc(x.tx?.block_number)}</td></tr>`).join("")
      }</tbody></table></div>`:`<div class="empty">${esc(tr("無交易紀錄"))}</div>`}
    `;
  }


  }
  render();
  window.addEventListener("ipt-language-change",render);
  $("printBtn").addEventListener("click",()=>{
    $("printNote").textContent=tr("已送出系統列印要求。若仍沒有跳出，請使用右上角選單的分享／列印功能。");
    try{window.print()}catch(err){
      $("printNote").textContent=tr("此瀏覽器不支援 window.print()。請使用右上角選單的分享／列印功能。");
    }
  });
  $("backBtn").addEventListener("click",()=>history.back());
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js?v=4142",{updateViaCache:"none"}).catch(()=>{}));
}
</script>

</body>
</html>
