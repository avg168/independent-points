<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Independent Points V4.0｜正式整合首頁</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  color:#172033;background:#f4f7fb
}
*{box-sizing:border-box;min-width:0}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;background:#f4f7fb;touch-action:pan-y}
header{
  background:#10243d;color:#fff;padding:26px 20px 32px;
  border-radius:0 0 28px 28px
}
.version{
  display:inline-block;margin-bottom:10px;padding:5px 10px;border-radius:999px;
  background:rgba(255,255,255,.14);font-size:.78rem;font-weight:800
}
header h1{margin:0 0 8px;font-size:1.62rem}
header p{margin:0;line-height:1.65;opacity:.9}
main{max-width:780px;margin:auto;padding:18px 14px 76px}
.panel{
  background:#fff;border:1px solid #dde5ef;border-radius:18px;padding:16px;
  margin-bottom:14px;box-shadow:0 4px 18px rgba(24,42,68,.05);
  width:100%;max-width:100%
}
.panel h2{margin:0 0 12px;color:#17365d;font-size:1.13rem}
.status{
  border-radius:12px;padding:12px 14px;line-height:1.6;
  background:#fff7df;color:#7e5a08;border:1px solid #efd996
}
.status.ok{background:#ebf8f2;color:#17694f;border-color:#bee5d6}
.status.err{background:#fff0f0;color:#922c2c;border-color:#efc8c8}
.profile{
  margin-top:12px;border:1px solid #d9e2ed;border-radius:16px;
  padding:14px;background:#f8fafc
}
.profile-title{font-size:1.08rem;font-weight:900;color:#17365d}
.profile-sub{margin-top:5px;color:#64748b;line-height:1.55;word-break:break-all}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{
  display:inline-block;padding:4px 9px;border-radius:999px;font-size:.76rem;
  font-weight:800;background:#eef2f7;color:#475569
}
.chip.ok{background:#e8f7ef;color:#17694f}
.chip.admin{background:#e8efff;color:#284b88}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{
  background:#f8fafc;border:1px solid #e1e7ef;border-radius:15px;padding:14px
}
.card .label{font-size:.8rem;color:#64748b;margin-bottom:5px}
.card .value{font-size:1.14rem;font-weight:900;color:#17365d;word-break:break-word}
.card.green .value{color:#176c59}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.menu{
  border:1px solid #d9e2ed;border-radius:16px;padding:14px;background:#fff;
  cursor:pointer;text-align:left;min-height:112px
}
.menu:active{transform:scale(.99)}
.menu .icon{font-size:1.35rem;margin-bottom:8px}
.menu .title{font-weight:900;color:#17365d;font-size:1rem}
.menu .desc{font-size:.78rem;color:#64748b;line-height:1.45;margin-top:5px}
.menu.primary{background:#176c59;border-color:#176c59}
.menu.primary .title,.menu.primary .desc{color:#fff}
.menu.blue{background:#2a5f91;border-color:#2a5f91}
.menu.blue .title,.menu.blue .desc{color:#fff}
.menu:disabled{opacity:.45;cursor:not-allowed;transform:none}
.admin-panel{display:none}
body.is-admin .admin-panel{display:block}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{
  min-height:48px;border-radius:12px;border:1px solid #cbd5e1;padding:10px 12px;
  font:inherit;font-weight:900;cursor:pointer
}
button.primary{background:#176c59;color:#fff;border-color:#176c59}
button.secondary{background:#2a5f91;color:#fff;border-color:#2a5f91}
button.light{background:#fff;color:#29445f}
.note{font-size:.82rem;color:#64748b;line-height:1.6;margin-top:10px}
.wallet{overflow-wrap:anywhere;word-break:break-word}
@media(min-width:680px){
  .summary{grid-template-columns:repeat(4,minmax(0,1fr))}
  .menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<header>
  <div class="version">V4.0.2</div>
  <h1>Independent Points</h1>
  <p>會員 × 錢包 × IPT 資產 × 交易 × 管理，一個入口完成。</p>
</header>

<main>
  <section class="panel">
    <h2>我的帳戶</h2>
    <div id="statusBox" class="status">正在確認登入狀態…</div>

    <div id="profileBox" class="profile" style="display:none">
      <div id="profileTitle" class="profile-title">—</div>
      <div id="profileEmail" class="profile-sub">—</div>
      <div id="profileWallet" class="profile-sub wallet">—</div>
      <div id="profileChips" class="chips"></div>
    </div>

    <div class="actions" style="margin-top:12px">
      <button id="refreshBtn" class="primary" type="button">重新整理</button>
      <button id="loginBtn" class="light" type="button">會員登入／主錢包</button>
    </div>
  </section>

  <section id="assetSummarySection" class="panel" style="display:none">
    <h2>我的 IPT</h2>
    <div class="summary">
      <div class="card green">
        <div class="label">目前餘額</div>
        <div id="iptBalance" class="value">—</div>
      </div>
      <div class="card">
        <div class="label">累計轉入</div>
        <div id="iptIncoming" class="value">—</div>
      </div>
      <div class="card">
        <div class="label">累計轉出</div>
        <div id="iptOutgoing" class="value">—</div>
      </div>
      <div class="card">
        <div class="label">交易筆數</div>
        <div id="iptTxCount" class="value">—</div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>會員功能</h2>
    <div class="menu-grid">
      <button id="myAssetBtn" class="menu primary" type="button" disabled>
        <div class="icon">📊</div>
        <div class="title">我的資產</div>
        <div class="desc">餘額、轉入轉出、CSV、PDF 報表</div>
      </button>

      <button id="balanceBtn" class="menu" type="button">
        <div class="icon">💰</div>
        <div class="title">查看點數</div>
        <div class="desc">進入 IPT 錢包查看鏈上餘額</div>
      </button>

      <button id="transferBtn" class="menu blue" type="button">
        <div class="icon">↗️</div>
        <div class="title">IPT 轉帳</div>
        <div class="desc">前置檢查後由 Trust Wallet 核准</div>
      </button>

      <button id="receiveBtn" class="menu" type="button">
        <div class="icon">📥</div>
        <div class="title">收款</div>
        <div class="desc">回到主錢包頁使用收款功能</div>
      </button>

      <button id="historyBtn" class="menu" type="button" disabled>
        <div class="icon">🧾</div>
        <div class="title">交易紀錄</div>
        <div class="desc">查看自己的 IPT 鏈上交易明細</div>
      </button>

      <button id="assetCenterBtn" class="menu" type="button" disabled>
        <div class="icon">🗂️</div>
        <div class="title">資產中心</div>
        <div class="desc">會員／管理員報表統一入口</div>
      </button>
    </div>
  </section>

  <section class="panel admin-panel">
    <h2>管理中心</h2>
    <div class="menu-grid">
      <button id="adminAssetBtn" class="menu blue" type="button">
        <div class="icon">📈</div>
        <div class="title">資產彙總</div>
        <div class="desc">會員資產、區間報表、CSV、PDF</div>
      </button>

      <button id="adminMemberBtn" class="menu" type="button">
        <div class="icon">👥</div>
        <div class="title">會員管理</div>
        <div class="desc">回主系統進入會員管理功能</div>
      </button>

      <button id="mintBtn" class="menu" type="button">
        <div class="icon">➕</div>
        <div class="title">Mint</div>
        <div class="desc">管理者發行 IPT</div>
      </button>

      <button id="pauseBtn" class="menu" type="button">
        <div class="icon">⏸️</div>
        <div class="title">暫停／恢復</div>
        <div class="desc">管理 IPT 合約交易狀態</div>
      </button>

      <button id="ownershipBtn" class="menu" type="button">
        <div class="icon">🔐</div>
        <div class="title">管理權</div>
        <div class="desc">Owner / pendingOwner 交接</div>
      </button>

      <button id="advancedBtn" class="menu" type="button">
        <div class="icon">⚙️</div>
        <div class="title">進階功能</div>
        <div class="desc">回到完整 IPT 系統操作頁</div>
      </button>
    </div>
  </section>

  <section class="panel">
    <h2>V4.0.2 正式定版</h2>
    <div class="status ok" style="margin-bottom:12px">正式首頁已啟用，會員與管理員入口均已整合完成。</div>
    <div class="note">
      V4.0.2 已作為正式統一首頁。原本通過驗證的錢包核心保留在 wallet-core-v3.8.2.html；會員與管理員資產報表沿用 V3.9.4.2 穩定版。
    </div>
  </section>
</main>

<script>
(() => {
  const SUPABASE_URL="https://uccexvgqmoxhgykkjdcy.supabase.co";
  const SUPABASE_KEY="sb_publishable_FBsN1DYTQMv2_bWhpbXHAA_qdAq7ri7";

  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });

  const $=id=>document.getElementById(id);

  function go(url){ location.href=url; }

  function setStatus(kind,text){
    const el=$("statusBox");
    el.className="status "+kind;
    el.textContent=text;
  }

  function fmtNumber(v){
    const n=Number(String(v??"0"));
    if(!Number.isFinite(n)) return String(v??"0");
    return n.toLocaleString("zh-TW",{maximumFractionDigits:8});
  }

  async function load(){
    document.body.classList.remove("is-admin");
    $("profileBox").style.display="none";
    $("assetSummarySection").style.display="none";
    $("myAssetBtn").disabled=true;
    $("historyBtn").disabled=true;
    $("assetCenterBtn").disabled=true;
    setStatus("","正在確認登入狀態…");

    try{
      const {data:{session},error}=await sb.auth.getSession();
      if(error) throw error;

      if(!session?.user){
        setStatus("err","目前尚未登入會員。請先按「會員登入／主錢包」。");
        return;
      }

      const uid=session.user.id;
      const [pRes,rRes,wRes,vRes]=await Promise.all([
        sb.from("member_profiles")
          .select("member_number,display_name,status")
          .eq("id",uid).maybeSingle(),
        sb.from("member_roles")
          .select("role")
          .eq("user_id",uid).maybeSingle(),
        sb.from("member_wallets")
          .select("wallet_address,is_primary,chain_id,created_at")
          .eq("user_id",uid)
          .eq("chain_id",11155111)
          .order("is_primary",{ascending:false})
          .order("created_at",{ascending:true}),
        sb.from("verified_wallets")
          .select("wallet_address,verified_at")
          .eq("user_id",uid)
          .eq("chain_id",11155111)
      ]);

      if(pRes.error) throw pRes.error;
      if(rRes.error) throw rRes.error;
      if(wRes.error) throw wRes.error;
      if(vRes.error) throw vRes.error;
      if(!pRes.data) throw new Error("找不到會員資料。");

      const p=pRes.data;
      const role=rRes.data?.role||"member";
      const wallets=wRes.data||[];
      const primary=wallets.find(w=>w.is_primary)||wallets[0]||null;
      const address=String(primary?.wallet_address||"");
      const verified=(vRes.data||[]).some(v=>
        String(v.wallet_address||"").toLowerCase()===address.toLowerCase()
      );

      $("profileTitle").textContent=`${p.member_number||"—"}｜${p.display_name||"—"}`;
      $("profileEmail").textContent=session.user.email||"—";
      $("profileWallet").textContent=address ? "主錢包："+address : "主錢包：尚未綁定";
      $("profileChips").innerHTML=
        `<span class="chip ${role==="admin"?"admin":""}">${role==="admin"?"管理員":"會員"}</span>`+
        `<span class="chip ${p.status==="active"?"ok":""}">${p.status==="active"?"正常":"已停權"}</span>`+
        `<span class="chip ${verified?"ok":""}">${verified?"錢包已驗證":"錢包未驗證"}</span>`;
      $("profileBox").style.display="block";

      if(p.status!=="active"){
        setStatus("err","會員目前為停權狀態，會員資產入口已停用。");
        return;
      }

      $("myAssetBtn").disabled=false;
      $("historyBtn").disabled=false;
      $("assetCenterBtn").disabled=false;
      if(role==="admin") document.body.classList.add("is-admin");

      setStatus("ok",
        role==="admin"
          ?"V4.0.2 已登入：會員功能與管理中心均已開放。"
          :"V4.0.2 已登入：會員功能已開放。"
      );

      try{
        const {data:asset,error:assetError}=await sb.functions.invoke("member-asset-detail",{body:{}});
        if(!assetError && asset?.ok){
          $("iptBalance").textContent=fmtNumber(asset.member?.ipt_balance||0)+" IPT";
          $("iptIncoming").textContent=fmtNumber(asset.asset?.total_incoming||0)+" IPT";
          $("iptOutgoing").textContent=fmtNumber(asset.asset?.total_outgoing||0)+" IPT";
          $("iptTxCount").textContent=asset.asset?.total_transactions??0;
          $("assetSummarySection").style.display="block";
        }
      }catch(_){}
    }catch(err){
      console.error(err);
      setStatus("err","載入失敗："+(err?.message||String(err)));
    }
  }

  $("refreshBtn").addEventListener("click",load);
  $("loginBtn").addEventListener("click",()=>go("./wallet-core-v3.8.2.html"));

  $("myAssetBtn").addEventListener("click",()=>go("./member-assets-v3.9.4.2.html?v=3942"));
  $("historyBtn").addEventListener("click",()=>go("./member-assets-v3.9.4.2.html?v=3942#txSection"));
  $("assetCenterBtn").addEventListener("click",()=>go("./asset-center-v3.9.4.2.html?v=3942"));

  $("balanceBtn").addEventListener("click",()=>go("./wallet-core-v3.8.2.html#balanceSection"));
  $("transferBtn").addEventListener("click",()=>go("./wallet-core-v3.8.2.html#transferSection"));
  $("receiveBtn").addEventListener("click",()=>go("./wallet-core-v3.8.2.html"));

  $("adminAssetBtn").addEventListener("click",()=>go("./admin-assets-v3.9.4.2.html?v=3942"));
  $("adminMemberBtn").addEventListener("click",()=>go("./wallet-core-v3.8.2.html"));
  $("mintBtn").addEventListener("click",()=>go("./wallet-core-v3.8.2.html#mintSection"));
  $("pauseBtn").addEventListener("click",()=>go("./wallet-core-v3.8.2.html#pauseSection"));
  $("ownershipBtn").addEventListener("click",()=>go("./wallet-core-v3.8.2.html#ownershipSection"));
  $("advancedBtn").addEventListener("click",()=>go("./wallet-core-v3.8.2.html"));

  load();
})();
</script>
</body>
</html>
